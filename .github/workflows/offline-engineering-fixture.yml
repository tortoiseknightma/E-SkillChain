name: offline-engineering-fixture

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: uv run pytest tests/test_offline_engineering_fixture.py -q
