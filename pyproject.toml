[project]
name = "skillchain"
version = "0.1.0"
description = "Auditable public-data framework for reproducing SkillChain mechanisms in image-based e-commerce agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Wenxi Ma", email = "tortoise_knight@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "bm25s>=0.3.9",
    "faiss-cpu>=1.14.3",
    "ijson>=3.5.1",
    "imagehash>=4.3.2",
    "jieba>=0.42.1",
    "joblib>=1.5,<1.6",
    "langgraph>=1.2.8",
    "modelscope>=1.38.1",
    "open-clip-torch==3.3.0",
    "openai>=2.44.0",
    "packaging>=26.2",
    "pillow>=12.3.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rapidocr-onnxruntime==1.4.4",
    "scikit-learn>=1.8,<1.9",
    "scipy>=1.18.0",
    "ultralytics==8.4.104",
    "transformers==5.14.1",
    "sentencepiece==0.2.2",
]

[project.scripts]
skillchain-offline-fixture = "skillchain.offline_fixture:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["-m", "not integration"]
markers = [
    "integration: explicit opt-in tests that may access real external services and incur cost",
]
